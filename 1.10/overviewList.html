<!-- 
There are three type of list.
01. Ordered List (ol)
==> Sequence follow must.
02. Unordered List (ul)
==> List needed but sequence not.
03. Description List (dl)
==> Describe something.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About List</title>
</head>

<body>
    <ol>
        <li>Step-01</li>
        <li>Step-02</li>
        <li>Step-03</li>
    </ol>
    <ul>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ul>
    <dl>
        <dt>HTML</dt>
        <dd>A markup language for building web pages.</dd>
    </dl>
</body>

</html>
